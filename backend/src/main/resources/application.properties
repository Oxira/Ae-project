# ============================================================
#  Brigade des Sangliers - Configuration Spring Boot
#  Surcharge possible via variables d'environnement Docker
# ============================================================

server.port=8080

# --- MQTT ---
# URL du broker Mosquitto (service Docker dans le meme reseau)
mqtt.broker.url=tcp://mosquitto:1883
mqtt.client.id=brigade-backend
mqtt.topic.events=brigade/game/event
mqtt.topic.commands=brigade/game/command
# Laisser vide si pas d'authentification
mqtt.username=
mqtt.password=

# --- Logging ---
logging.level.fr.brigadesangliers=INFO
logging.level.org.eclipse.paho=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# --- Serialisation JSON ---
spring.jackson.serialization.indent-output=false
spring.jackson.default-property-inclusion=non_null

# --- Fichiers statiques (frontend web) ---
# Placer les fichiers de web/ dans src/main/resources/static/
spring.web.resources.static-locations=classpath:/static/
