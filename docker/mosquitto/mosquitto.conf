# ============================================================
#  Mosquitto MQTT Broker - Configuration Brigade des Sangliers
# ============================================================

listener 1883
protocol mqtt

# Autoriser les connexions anonymes (reseau interne Docker)
# Pour ajouter auth : commenter la ligne ci-dessous et configurer password_file
allow_anonymous true

# Persistance des messages QoS 1/2
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Conserver les messages en cas de reconnexion client
# (utile si le backend demarre apres le field server)
queue_qos0_messages true
max_queued_messages 100
